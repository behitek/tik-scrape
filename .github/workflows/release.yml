name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Generate icon
        run: uv run python assets/create_icon.py

      - name: Build executable (PyInstaller)
        run: uv run pyinstaller build.spec --clean --noconfirm

      - name: Resolve version
        shell: pwsh
        run: |
          $v = (uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path 'dist\TikTokImageScraper\*' -DestinationPath "dist\TikTokImageScraper-v$env:APP_VERSION-win64.zip" -Force

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DAPP_VERSION=$env:APP_VERSION" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/TikTokImageScraper-v*-Setup-win64.exe
            dist/TikTokImageScraper-v*-win64.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            (Get-ChildItem dist\TikTokImageScraper-v*-Setup-win64.exe, dist\TikTokImageScraper-v*-win64.zip).FullName `
            --title "TikTok Image Scraper ${{ github.ref_name }}" `
            --generate-notes
