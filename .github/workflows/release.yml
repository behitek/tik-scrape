name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Generate icon
        run: uv run python assets/create_icon.py

      - name: Build executable (PyInstaller)
        run: uv run pyinstaller build.spec --clean --noconfirm

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path 'dist\TikTokImageScraper\*' -DestinationPath 'dist\TikTokImageScraper-v1.0.0-win64.zip' -Force

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/TikTokImageScraper-v*-Setup-win64.exe
            dist/TikTokImageScraper-v*-win64.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            (Get-ChildItem dist\TikTokImageScraper-v*-Setup-win64.exe, dist\TikTokImageScraper-v*-win64.zip).FullName `
            --title "TikTok Image Scraper ${{ github.ref_name }}" `
            --generate-notes
