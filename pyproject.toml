[project]
name = "tik-scrape"
version = "1.0.0"
description = "TikTok product image scraper desktop app"
authors = [
    {name = "Hieu Nguyen", email = "hieunv.dev@gmail.com"}
]
maintainers = [
    {name = "Hieu Nguyen", email = "hieunv.dev@gmail.com"}
]
license = {text = "Proprietary"}
keywords = ["tiktok", "scraper", "image", "downloader"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "PySide6>=6.5",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "Pillow>=10.0",
    "playwright>=1.44",
    "openpyxl>=3.1",
]

[project.scripts]
start = "main:main"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
